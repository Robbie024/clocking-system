<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock-In System</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .form-container {
      display: none;
      margin-top: 20px;
    }
    .warning {
      color: red;
      font-weight: bold;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Clock-In System</h1>
  <p>Click the button below to clock in:</p>
  <button onclick="checkLocation()">Clock In</button>
  <div class="warning" id="warning" style="display: none;"></div>
  <div class="form-container" id="clockInForm">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe7gB2x7KmwUXK-AY9v0Vo0PvLJ2bQ6DaXOLlaSJ3wLF9C7Mw/viewform?embedded=true" allowfullscreen>Loading…</iframe>
  </div>
  <script>
    const branches = [
      { name: "Accra", lat: 5.6580393, lng: -0.2651867 },
      { name: "Takoradi", lat: 4.897427, lng: -1.764115 }
    ];
    const maxDistance = 1; // in kilometers

    function toRad(deg) {
      return deg * Math.PI / 180;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in kilometers
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function checkLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          const nearBranch = branches.find(branch => 
            getDistance(userLat, userLng, branch.lat, branch.lng) <= maxDistance
          );

          if (nearBranch) {
            checkSubmissionDate();
          } else {
            document.getElementById("warning").textContent = "❌ You must be at either the Accra or Takoradi branch to clock in.";
            document.getElementById("warning").style.display = "block";
          }
        }, error => {
          document.getElementById("warning").textContent = "❌ Location access denied. Please enable GPS.";
          document.getElementById("warning").style.display = "block";
        });
      } else {
        document.getElementById("warning").textContent = "❌ Your browser does not support location services.";
        document.getElementById("warning").style.display = "block";
      }
    }

    function checkSubmissionDate() {
      const today = new Date().toISOString().split('T')[0]; // Get current date in YYYY-MM-DD format
      const clockInDate = localStorage.getItem('clockInDate'); // Retrieve the last clock-in date from localStorage

      if (clockInDate === today) {
        document.getElementById("warning").textContent = "❌ You have already clocked in today.";
        document.getElementById("warning").style.display = "block";
      } else {
        localStorage.setItem('clockInDate', today); // Save today's date as the clock-in date
        document.getElementById("clockInForm").style.display = "block"; // Show the clock-in form
        document.getElementById("warning").style.display = "none"; // Hide any warnings
      }
    }
  </script>
</body>
</html>
