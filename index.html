<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clock-In System</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .form-container {
      display: none;
      margin-top: 20px;
    }
    .warning {
      color: red;
      font-weight: bold;
      margin-top: 20px;
    }
    button, input {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Company Logo" style="width: 150px; margin-top: 20px;">
  </header>

  <h1>Clock-In System</h1>
  <p>Enter your full name and click the button below to clock in:</p>

  <input type="text" id="fullName" placeholder="Enter full name" />
  <br />
  <button onclick="checkLocation()">Clock In</button>

  <div class="warning" id="warning" style="display: none;"></div>

  <div class="form-container" id="clockin-container">
    <iframe id="clockin-iframe" width="640" height="800" frameborder="0" marginheight="0" marginwidth="0">Loading...</iframe>
  </div>

  <script>
    const branches = [
      { name: "Accra", lat: 5.6580393, lng: -0.2651867 },
      { name: "Takoradi", lat: 4.897427, lng: -1.764115 }
    ];
    const maxDistance = 10; // km

    function toRad(deg) {
      return deg * Math.PI / 180;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function checkLocation() {
      const fullName = document.getElementById("fullName").value.trim();
      if (!fullName) {
        document.getElementById("warning").textContent = "❌ Please enter your full name.";
        document.getElementById("warning").style.display = "block";
        return;
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          let isNearBranch = false;
          branches.forEach(branch => {
            const distance = getDistance(userLat, userLng, branch.lat, branch.lng);
            if (distance <= maxDistance) {
              isNearBranch = true;
              checkDuplicate(fullName, isDuplicate => {
                if (isDuplicate) {
                  document.getElementById("warning").textContent = "❌ You have already submitted today.";
                  document.getElementById("warning").style.display = "block";
                } else {
                  checkSubmissionDate(fullName);
                }
              });
            }
          });

          if (!isNearBranch) {
            document.getElementById("warning").textContent = "❌ You must be at either the Accra or Takoradi branch to clock in.";
            document.getElementById("warning").style.display = "block";
          }
        }, error => {
          console.error("Geolocation error:", error);
          document.getElementById("warning").textContent = "❌ Location access denied. Please enable GPS.";
          document.getElementById("warning").style.display = "block";
        });
      } else {
        document.getElementById("warning").textContent = "❌ Your browser does not support location services.";
        document.getElementById("warning").style.display = "block";
      }
    }

    function checkSubmissionDate(fullName) {
      // Check if the user has already clocked in today
      const today = new Date().toISOString().split('T')[0];
      const scriptUrl = "https://script.google.com/macros/s/AKfycbwSDlXhRUnjK9NsrYQiWTlUS_6EPSJjikVvtm86yFJoUxAkL_413lUwdI2vwGCPqbpr/exec";

      fetch(`${scriptUrl}?fullName=${encodeURIComponent(fullName)}&date=${today}`)
        .then(response => response.text())
        .then(result => {
          if (result === "ALREADY_CLOCKED_IN") {
            document.getElementById("warning").textContent = "❌ You have already clocked in today.";
            document.getElementById("warning").style.display = "block";
          } else {
            document.getElementById("clockin-container").style.display = "block";
            document.getElementById("warning").style.display = "none";
            loadFormWithTimestamp(fullName);
          }
        })
        .catch(error => {
          console.error("Error checking submission date:", error);
          document.getElementById("warning").textContent = "❌ Error verifying submission. Try again later.";
          document.getElementById("warning").style.display = "block";
        });
    }

    function loadFormWithTimestamp(fullName) {
      const iframe = document.getElementById('clockin-iframe');
      const timestamp = Date.now();
      iframe.src = `https://docs.google.com/forms/d/e/1FAIpQLSfs5WTxg_Uki715t7WbYR3Wu2HQz-XUaz-7R2pwSnPUMjJ0Dw/viewform?embedded=true&entry.648050963=${encodeURIComponent(fullName)}&entry.timestamp=${timestamp}`;
    }

    function checkDuplicate(fullName, callback) {
  const scriptUrl = "https://script.google.com/macros/s/AKfycbz3NwWX6GU4OspTcWio-ZUOa_2pFvwLh4PMDRGErtdjAX67fLG1cUlYPA6D09IsFvufzA/exec";

  fetch(`${scriptUrl}?fullName=${encodeURIComponent(fullName)}`)
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      return response.text();
    })
    .then(result => {
      if (result === "DUPLICATE") {
        document.getElementById("warning").textContent = "❌ You have already submitted today.";
        document.getElementById("warning").style.display = "block";
        callback(true);
      } else {
        callback(false);
      }
    })
    .catch(error => {
      console.error("Error checking duplicate:", error);
      document.getElementById("warning").textContent = `❌ Error verifying submission: ${error.message}. Try again later.`;
      document.getElementById("warning").style.display = "block";
    });
}

  </script>
</body>
</html>
